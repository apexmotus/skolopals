name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}

jobs:
  deploy-dev:
    name: Deploy (dev)
    runs-on: ubuntu-latest
    environment: dev
    outputs:
      api_url: ${{ steps.deploy-api.outputs.url }}
      web_url: ${{ steps.deploy-web.outputs.url }}
    steps:
      - name: Guard — VERCEL_TOKEN must be set
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "::error::VERCEL_TOKEN repo secret is not set. See docs/DEPLOY.md." >&2
            exit 1
          fi

      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
      - run: npm install -g vercel@latest

      - name: Deploy api (preview)
        id: deploy-api
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_API }}
        run: |
          vercel --cwd api pull --yes --environment=preview --token="${{ secrets.VERCEL_TOKEN }}"
          vercel --cwd api build --token="${{ secrets.VERCEL_TOKEN }}"
          url=$(vercel --cwd api deploy --prebuilt --token="${{ secrets.VERCEL_TOKEN }}" \
            --env CORS_ORIGINS="${{ vars.CORS_ORIGINS }}")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          vercel alias set "$url" skolopals-api-dev.vercel.app \
            --scope=apex-motus --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy web (preview)
        id: deploy-web
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_WEB }}
        run: |
          vercel --cwd web pull --yes --environment=preview --token="${{ secrets.VERCEL_TOKEN }}"
          vercel --cwd web build --token="${{ secrets.VERCEL_TOKEN }}"
          url=$(vercel --cwd web deploy --prebuilt --token="${{ secrets.VERCEL_TOKEN }}" \
            --env API_URL="${{ vars.API_URL }}")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          vercel alias set "$url" skolopals-web-dev.vercel.app \
            --scope=apex-motus --token="${{ secrets.VERCEL_TOKEN }}"

  smoke-dev:
    name: Smoke test (dev)
    needs: deploy-dev
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Install Playwright (with retry — apt mirrors are occasionally flaky on GitHub-hosted runners)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 15
          command: cd web && npx playwright install --with-deps chromium
      - name: Smoke test api
        run: curl -sf --retry 5 --retry-delay 5 --retry-connrefused https://skolopals-api-dev.vercel.app/api/health/live
      - name: Smoke test web
        run: node scripts/smoke.mjs https://skolopals-web-dev.vercel.app

  deploy-uat:
    name: Deploy (uat) — alias flip only
    needs: [deploy-dev, smoke-dev]
    runs-on: ubuntu-latest
    environment: uat
    steps:
      - run: npm install -g vercel@latest

      - name: Alias api dev deployment to uat
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_API }}
        run: |
          vercel alias set "${{ needs.deploy-dev.outputs.api_url }}" skolopals-api-uat.vercel.app \
            --scope=apex-motus --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Alias web dev deployment to uat
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_WEB }}
        run: |
          vercel alias set "${{ needs.deploy-dev.outputs.web_url }}" skolopals-web-uat.vercel.app \
            --scope=apex-motus --token="${{ secrets.VERCEL_TOKEN }}"

  deploy-prod:
    name: Deploy (production)
    needs: deploy-uat
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Guard — production API_URL must be configured
        run: |
          if [ -z "${{ vars.API_URL }}" ]; then
            echo "::error::No API_URL variable set on the production environment. Refusing to ship web/ pointed at an unknown backend." >&2
            exit 1
          fi

      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
      - run: npm install -g vercel@latest

      - name: Deploy api (production)
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_API }}
        run: |
          vercel --cwd api pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"
          vercel --cwd api build --prod --token="${{ secrets.VERCEL_TOKEN }}"
          url=$(vercel --cwd api deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}" \
            --env CORS_ORIGINS="${{ vars.CORS_ORIGINS }}")
          vercel alias set "$url" skolopals-api.vercel.app \
            --scope=apex-motus --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy web (production)
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_WEB }}
        run: |
          vercel --cwd web pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"
          vercel --cwd web build --prod --token="${{ secrets.VERCEL_TOKEN }}"
          url=$(vercel --cwd web deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}" \
            --env API_URL="${{ vars.API_URL }}")
          vercel alias set "$url" skolopals-web.vercel.app \
            --scope=apex-motus --token="${{ secrets.VERCEL_TOKEN }}"
